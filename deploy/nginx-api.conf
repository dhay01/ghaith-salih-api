# api.ghaith-art.com — TLS is terminated at Cloudflare; origin uses Origin CA.
map $http_origin $cors_origin {
    default "";
    ~^https://(www\.)?ghaith-art\.com$ $http_origin;
    ~^https://[a-z0-9.-]+\.ghaith-art\.pages\.dev$ $http_origin;
}

limit_req_zone $binary_remote_addr zone=ghaith_api:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name api.ghaith-art.com;

    ssl_certificate     /etc/ssl/ghaith/origin.crt;
    ssl_certificate_key /etc/ssl/ghaith/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/ghaith-salih-api/public;
    index index.php;
    charset utf-8;

    client_max_body_size 32m;
    client_body_timeout 60s;
    send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location ^~ /storage/ {
        alias /var/www/ghaith-salih-api/storage/app/public/;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        location ~* \.(?:jpg|jpeg|png|webp|avif|gif|svg|js|css|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary Origin always;
        }

        location ~* /tiles/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary Origin always;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_req zone=ghaith_api burst=20 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
