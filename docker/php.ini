; Sized for the dashboard's large originals; nginx has a matching
; client_max_body_size and the chunked uploader splits anything bigger.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 1800

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
