[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Tiling is queued (GenerateDeepZoomTiles implements ShouldQueue), so without a
; worker every upload sits at "pending" forever. --timeout must stay above
; GIGAPIXEL_TIMEOUT or the worker kills the job before it finishes.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=1 --timeout=1830 --sleep=3 --max-time=3600
autorestart=true
priority=20
stopwaitsecs=1860
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
